# PERPHECT pre-training configuration
# Usage: python train.py --config config_pretrain.yaml

training:
  epochs: 15
  batch_size: 32
  patience: 5
  learning_rate: 0.0004
  focal_alpha: 0.25
  focal_gamma: 2.0

data:
  negative_ratio: 1.0
  bacterium_threshold: 7000000
  phage_threshold: 200000
  bacterium_min_length: 150000
  phage_min_length: 1500

output:
  dir: results

gpu:
  enabled: true