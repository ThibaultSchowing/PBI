# PERPHECT fine-tuning configuration
# Usage: python train.py --config config_finetune.yaml --pretrained-model <path> --exclude-sources PERPHECT_private --exclude-ids test_data/excluded_pairs.csv

training:
  epochs: 5                    # fine_tune_epochs
  batch_size: 16               # smaller batch for fine-tuning
  patience: 3
  learning_rate: 0.0004        # ignored when fine-tuning (uses fine_tune_lr)
  fine_tune_lr: 0.0001         # lower LR for fine-tuning
  fine_tune_epochs: 5
  freeze_base: true            # freeze CNN encoders
  freeze_up_to: "concatenated_features"
  focal_alpha: 0.25
  focal_gamma: 2.0
  finetuned_model_name: "model_finetuned_best.keras"

data:
  negative_ratio: 1.0
  bacterium_threshold: 7000000
  phage_threshold: 200000
  bacterium_min_length: 150000
  phage_min_length: 1500

output:
  dir: results

gpu:
  enabled: true