name: CI Pipeline and DB Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - add_ci_tests

env:
  IMAGE_NAME: pbiscope-ci

jobs:
  pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workflow/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:latest
          load: true
          cache-from: type=gha,scope=pbiscope-pipeline
          cache-to: type=gha,mode=max,scope=pbiscope-pipeline

      - name: Run pipeline (CI subset)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data:/data \
            -v ${{ github.workspace }}/pipeline_logs:/pipeline-logs \
            -v ${{ github.workspace }}/private_data:/private-data \
            -e NCBI_EMAIL="ci@example.com" \
            -e PBI_DATA_DIR="/data" \
            -e PBI_LOGS_DIR="/pipeline-logs" \
            -e PBI_PRIVATE_DATA_DIR="/private-data" \
            ${{ env.IMAGE_NAME }} \
            snakemake \
              --cores 2 \
              --use-conda \
              --conda-prefix /cache/conda \
              --directory /app/workflow \
              --snakefile /app/workflow/Snakefile.ci

      - name: Install pbi and run smoke tests
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data:/data \
            -v ${{ github.workspace }}/pipeline_logs:/pipeline-logs \
            -v ${{ github.workspace }}/private_data:/private-data \
            -v ${{ github.workspace }}/tests:/app/tests \
            -e DATA_PATH="/data/processed" \
            ${{ env.IMAGE_NAME }}:latest \
            bash -c "
              pip install -e /app/. pytest && \
              python -m pytest /app/tests/test_pbi_ci_smoke.py /app/tests/test_private_data_ingestion.py -v
            "

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: pipeline_logs/
          retention-days: 7

      - name: Upload merged outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-data
          path: data/intermediate/csv/merged/
          retention-days: 7
