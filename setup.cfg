[tool:pytest]
testpaths = tests
markers =
    unit: Fast unit tests (no I/O, no network)
    integration: Tests requiring file I/O or database
    slow: Tests requiring network or large data
addopts = -v --tb=short

[coverage:run]
source = src/pbi
omit = tests/*

[coverage:report]
fail_under = 0
show_missing = true
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
