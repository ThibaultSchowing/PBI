# CI configuration — overrides for fast pipeline testing.
#
# Usage:
#   snakemake --configfile workflow/config/config.ci.yaml --cores 2 -p
#
# What this does:
#   - Reduces 26 PhageScope data sources to 2 (RefSeq + Genbank)
#   - Reduces 9 metadata features to 3 (phage_metadata, annotated_proteins, transcription_terminator)
#   - Includes FASTA and GFF3 for the same 2 sources (required by merge rules)
#   - Skips host genome downloads (metadata_only_mode: true)
#
# Expected runtime: 15-30 minutes on a GitHub-hosted runner.

# ── Metadata sources (2 of 26) ──────────────────────────────────

phage_metadata_urls:
  "RefSeq_Phage_Metadata_URL": "https://phageapi.deepomics.org/files/Download/Phage_meta_data/refseq_phage_meta_data.tsv"
  "Genbank_Phage_Metadata_URL": "https://phageapi.deepomics.org/files/Download/Phage_meta_data/genbank_phage_meta_data.tsv"

annotated_proteins_metadata_urls:
  "RefSeq_Annotated_Proteins_metadata_URL": "https://phageapi.deepomics.org/files/Download/Annotated_protein_meta_data_v2/refseq_phage_annotated_protein_meta_data.tsv"
  "Genbank_Annotated_Proteins_metadata_URL": "https://phageapi.deepomics.org/files/Download/Annotated_protein_meta_data_v2/genbank_phage_annotated_protein_meta_data.tsv"

transcription_terminator_metadata_urls:
  "RefSeq_Phage_Transcription_Terminator_Metadata_URL": "https://phageapi.deepomics.org/files/Download/Transcription_terminators_meta_data/refseq_phage_transcription_terminator_meta_data.tsv"
  "Genbank_Phage_Transcription_Terminator_Metadata_URL": "https://phageapi.deepomics.org/files/Download/Transcription_terminators_meta_data/genbank_phage_transcription_terminator_meta_data.tsv"

# ── Remaining features: empty (rules produce no files) ───────────

phage_trna_tmrna_metadata_urls: {}
phage_anti_crispr_metadata_urls: {}
phage_virulent_factor_metadata_urls: {}
phage_transmembrane_protein_metadata_urls: {}
antimicrobial_resistance_gene_metadata_urls: {}
crispr_array_metadata_urls: {}

# ── FASTA downloads (same 2 sources) ────────────────────────────
# Required: merge_phage_fasta / merge_protein_fasta raise ValueError on empty input.

protein_fasta_urls:
  "Genbank": "https://phageapi.deepomics.org/fasta/phage_sequence/proteins/Genbank.tar.gz"
  "RefSeq": "https://phageapi.deepomics.org/fasta/phage_sequence/proteins/RefSeq.tar.gz"

phage_fasta_urls:
  "Genbank": "https://phageapi.deepomics.org/download/phage/fasta/?datasource=Genbank"
  "RefSeq": "https://phageapi.deepomics.org/download/phage/fasta/?datasource=RefSeq"

# ── GFF3 downloads (same 2 sources) ─────────────────────────────

phage_GFF3_urls:
  "Genbank": "https://phageapi.deepomics.org/fasta/phage_sequence/phage_gff3/Genbank.gff3"
  "RefSeq": "https://phageapi.deepomics.org/fasta/phage_sequence/phage_gff3/RefSeq.gff3"

# ── Skip host genome downloads (most expensive step) ────────────

metadata_only_mode: true
